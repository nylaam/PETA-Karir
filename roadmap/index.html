<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap — PETA Karir</title>
  <meta name="description" content="Roadmap interaktif belajar skill IT step by step." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../tailwind.config.js"></script>

  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/roadmap.css" />
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

  <div id="navbar"></div>

  <!-- Top bar: back + path info + filters + stats -->
  <div id="roadmap-topbar" class="hidden sticky top-16 z-40 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3 h-14 flex-wrap">

        <!-- Back -->
        <a href="../paths.html"
           class="flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-700 transition-colors shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Back
        </a>

        <div class="w-px h-4 bg-slate-200 shrink-0"></div>

        <!-- Path name + progress -->
        <div class="shrink-0">
          <p id="topbar-title" class="font-bold text-sm text-slate-900 leading-none"></p>
          <p id="topbar-sub"   class="text-xs text-slate-400 mt-0.5"></p>
        </div>

        <div class="flex-1"></div>

        <!-- Status filter -->
        <div class="flex items-center gap-1 shrink-0">
          <button data-filter="all"          class="filter-status-btn active  px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">All</button>
          <button data-filter="not_started"  class="filter-status-btn         px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">Not Started</button>
          <button data-filter="learning"     class="filter-status-btn         px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">Learning</button>
          <button data-filter="done"         class="filter-status-btn         px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">Done</button>
        </div>

        <!-- Stats -->
        <div class="hidden md:flex items-center gap-3 text-xs text-slate-400 shrink-0">
          <span class="flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span id="stat-done">0</span> done
          </span>
          <span class="flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="stat-learning">0</span> learning
          </span>
        </div>

      </div>
    </div>
  </div>

  <!-- Main layout: roadmap list + drawer -->
  <div id="roadmap-layout" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex gap-6">

    <!-- Nodes column -->
    <div id="roadmap-nodes" class="flex-1 min-w-0">
      <!-- filled by roadmap.js -->
    </div>

    <!-- Detail drawer (right panel) -->
    <aside id="node-drawer"
           class="hidden w-[360px] shrink-0 bg-white border border-slate-200 rounded-2xl shadow-lg self-start sticky top-32 overflow-hidden">
      <!-- filled by roadmap.js -->
    </aside>

  </div>

  <!-- Not found state -->
  <div id="not-found" class="hidden flex items-center justify-center min-h-[50vh]">
    <div class="text-center">
      <p class="text-slate-500 font-semibold mb-3">Path tidak ditemukan</p>
      <a href="../paths.html" class="btn btn-primary btn-md">Kembali ke Paths</a>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loading-state" class="flex items-center justify-center min-h-[50vh]">
    <div class="text-center">
      <div class="w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <p class="text-sm text-slate-400">Memuat roadmap...</p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="../js/data/paths.js"></script>
  <script src="../js/store/progressStore.js"></script>
  <script src="../js/components/Navbar.js"></script>
  <script src="../js/components/Footer.js"></script>
  <script src="../js/components/PathCard.js"></script>
  <script src="../js/pages/roadmap.js"></script>

</body>
</html>
